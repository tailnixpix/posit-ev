name: Deploy to Railway

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to Railway
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Railway redeploy via API
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
        run: |
          RESPONSE=$(curl -sf -X POST https://backboard.railway.app/graphql/v2 \
            -H "Authorization: Bearer $RAILWAY_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"query\":\"{ project(id: \\\"$RAILWAY_PROJECT_ID\\\") { environments { edges { node { id name } } } services { edges { node { id name } } } } }\"}")

          echo "Project response: $RESPONSE"

          SERVICE_ID=$(echo "$RESPONSE" | jq -r '.data.project.services.edges[0].node.id')
          ENV_ID=$(echo "$RESPONSE"     | jq -r '.data.project.environments.edges[0].node.id')

          echo "Service: $SERVICE_ID  |  Environment: $ENV_ID"

          if [ "$SERVICE_ID" = "null" ] || [ -z "$SERVICE_ID" ]; then
            echo "ERROR: Could not resolve service ID — verify RAILWAY_PROJECT_ID is correct"
            exit 1
          fi

          DEPLOY=$(curl -sf -X POST https://backboard.railway.app/graphql/v2 \
            -H "Authorization: Bearer $RAILWAY_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"query\":\"mutation { serviceInstanceRedeploy(serviceId: \\\"$SERVICE_ID\\\", environmentId: \\\"$ENV_ID\\\") }\"}")

          echo "Deploy triggered: $DEPLOY"

<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1200 630"
     style="width:100%;height:auto;display:block;"
     role="img" aria-label="Posit+EV — Find Every Edge. Beat the Market.">
  <title>Posit+EV — Find Every Edge. Beat the Market.</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="#0D0B2A"/>
      <stop offset="60%"  stop-color="#1E1A47"/>
      <stop offset="100%" stop-color="#2D2470"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="48%" r="42%">
      <stop offset="0%"  stop-color="#534AB7" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#534AB7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="arcStroke" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#AFA9EC" stop-opacity="0.15"/>
      <stop offset="50%"  stop-color="#7B72D9" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#AFA9EC" stop-opacity="0.15"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle grid -->
  <line x1="0"    y1="210" x2="1200" y2="210" stroke="#534AB7" stroke-opacity="0.06" stroke-width="1"/>
  <line x1="0"    y1="420" x2="1200" y2="420" stroke="#534AB7" stroke-opacity="0.06" stroke-width="1"/>
  <line x1="400"  y1="0"   x2="400"  y2="630" stroke="#534AB7" stroke-opacity="0.06" stroke-width="1"/>
  <line x1="800"  y1="0"   x2="800"  y2="630" stroke="#534AB7" stroke-opacity="0.06" stroke-width="1"/>

  <!-- Large decorative background arc — full width, sits behind everything -->
  <!-- +EV shaded zone (right half) -->
  <path d="M 600,95 C 720,95 870,190 960,400 L 600,400 Z"
        fill="#534AB7" fill-opacity="0.07"/>
  <!-- Arc curve -->
  <path d="M 240,400 C 360,30 840,30 960,400"
        fill="none" stroke="url(#arcStroke)" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Peak dot -->
  <circle cx="600" cy="60" r="9" fill="#7B72D9" fill-opacity="0.55"/>
  <!-- Vertical drop from peak (dashed) -->
  <line x1="600" y1="69" x2="600" y2="400"
        stroke="#534AB7" stroke-opacity="0.12" stroke-width="1.5" stroke-dasharray="6 5"/>

  <!-- Central glow -->
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- ── Icon: probability arc (centered, tight, above wordmark) ── -->
  <g transform="translate(510, 200)">
    <!-- +EV fill zone -->
    <path d="M 90,130 C 118,130 148,108 168,64 L 90,64 Z"
          fill="#534AB7" fill-opacity="0.14"/>
    <!-- Arc -->
    <path d="M 12,130 C 36,10 144,10 168,130"
          fill="none" stroke="#7B72D9" stroke-width="5" stroke-linecap="round"/>
    <!-- Peak dot -->
    <circle cx="90" cy="14"  r="9"  fill="#534AB7"/>
    <circle cx="90" cy="14"  r="4"  fill="#ffffff" fill-opacity="0.85"/>
  </g>

  <!-- ── Main wordmark ── -->
  <text x="600" y="382"
        text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif"
        font-size="108" font-weight="800" letter-spacing="-3">
    <tspan fill="#FFFFFF">Posit</tspan><tspan fill="#7B72D9">+</tspan><tspan fill="#FFFFFF">EV</tspan>
  </text>

  <!-- ── Tagline ── -->
  <text x="600" y="432"
        text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif"
        font-size="22" font-weight="400" letter-spacing="0.8"
        fill="#AFA9EC">
    Find Every Edge. Beat the Market.
  </text>

  <!-- ── Divider ── -->
  <line x1="460" y1="460" x2="740" y2="460"
        stroke="#534AB7" stroke-opacity="0.45" stroke-width="1"/>

  <!-- ── Pill badges ── -->
  <!-- Free Daily Pick -->
  <rect x="248" y="480" width="172" height="36" rx="18"
        fill="#534AB7" fill-opacity="0.20" stroke="#7B72D9" stroke-opacity="0.45" stroke-width="1.2"/>
  <text x="334" y="504" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif"
        font-size="13.5" font-weight="600" fill="#C4BFEF">Free Daily Pick</text>

  <!-- +EV Only -->
  <rect x="436" y="480" width="104" height="36" rx="18"
        fill="#534AB7" fill-opacity="0.20" stroke="#7B72D9" stroke-opacity="0.45" stroke-width="1.2"/>
  <text x="488" y="504" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif"
        font-size="13.5" font-weight="600" fill="#C4BFEF">+EV Only</text>

  <!-- AI Analysis -->
  <rect x="556" y="480" width="118" height="36" rx="18"
        fill="#534AB7" fill-opacity="0.20" stroke="#7B72D9" stroke-opacity="0.45" stroke-width="1.2"/>
  <text x="615" y="504" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif"
        font-size="13.5" font-weight="600" fill="#C4BFEF">AI Analysis</text>

  <!-- 8 Sports -->
  <rect x="690" y="480" width="100" height="36" rx="18"
        fill="#534AB7" fill-opacity="0.20" stroke="#7B72D9" stroke-opacity="0.45" stroke-width="1.2"/>
  <text x="740" y="504" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif"
        font-size="13.5" font-weight="600" fill="#C4BFEF">8 Sports</text>

  <!-- ── Logo card (bottom-left, subtle) ── -->
  <rect x="48" y="568" width="148" height="40" rx="8"
        fill="#EEEDFE" fill-opacity="0.10" stroke="#AFA9EC" stroke-opacity="0.20" stroke-width="1"/>
  <!-- tiny arc icon -->
  <g transform="translate(58, 572)">
    <path d="M 15,28 C 18,24 18,28 15,28"/>
    <path d="M 4,30 C 7,12 23,12 26,30"
          fill="none" stroke="#7B72D9" stroke-width="2" stroke-linecap="round" stroke-opacity="0.7"/>
    <circle cx="15" cy="14" r="2.5" fill="#7B72D9" fill-opacity="0.7"/>
  </g>
  <text x="88" y="594"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif"
        font-size="16" font-weight="700" letter-spacing="-0.3">
    <tspan fill="#C4BFEF" fill-opacity="0.7">Posit</tspan><tspan fill="#7B72D9" fill-opacity="0.8">+</tspan><tspan fill="#C4BFEF" fill-opacity="0.7">EV</tspan>
  </text>

  <!-- ── Domain (bottom-right) ── -->
  <text x="1152" y="594" text-anchor="end"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif"
        font-size="13" font-weight="500" letter-spacing="1.8"
        fill="#534AB7" fill-opacity="0.5">
    POSIT-EV.COM
  </text>

</svg>

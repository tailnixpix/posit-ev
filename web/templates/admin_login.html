<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Access — Posit+EV</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg" />
  <link rel="stylesheet" href="/static/styles.css" />
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0F0C2A 0%, #26215C 55%, #3D35A0 100%);
      padding: 24px;
    }

    .login-card {
      background: #ffffff;
      border-radius: 20px;
      padding: 48px 40px 40px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 24px 64px rgba(15, 12, 50, 0.35);
      text-align: center;
    }

    .login-icon {
      font-size: 2.4rem;
      line-height: 1;
      margin-bottom: 18px;
    }

    .login-title {
      font-size: 1.2rem;
      font-weight: 800;
      color: #1A1733;
      margin: 0 0 6px;
    }

    .login-sub {
      font-size: 0.82rem;
      color: #8E8BAA;
      margin: 0 0 32px;
    }

    /* ── PIN boxes ─────────────────────────────────────────── */
    .pin-row {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 28px;
    }

    .pin-box {
      width: 48px;
      height: 58px;
      font-size: 1.6rem;
      font-weight: 800;
      text-align: center;
      border: 2px solid #AFA9EC;
      border-radius: 12px;
      background: #F7F6FE;
      color: #1A1733;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s, background 0.15s;
      caret-color: transparent;
      /* prevent mobile zoom on focus */
      font-size: 1.5rem;
    }

    .pin-box:focus {
      border-color: #534AB7;
      background: #fff;
      box-shadow: 0 0 0 3px rgba(83,74,183,0.18);
    }

    .pin-box.filled {
      border-color: #534AB7;
      background: #EEEDFE;
    }

    .pin-box.error {
      border-color: #C53030;
      background: #FFF0F0;
      animation: shake 0.35s ease;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%       { transform: translateX(-5px); }
      40%       { transform: translateX(5px); }
      60%       { transform: translateX(-4px); }
      80%       { transform: translateX(4px); }
    }

    /* ── Submit button ─────────────────────────────────────── */
    .pin-submit {
      width: 100%;
      padding: 14px;
      background: #534AB7;
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
      letter-spacing: 0.2px;
    }
    .pin-submit:hover   { opacity: 0.9; }
    .pin-submit:active  { transform: scale(0.98); }
    .pin-submit:disabled { opacity: 0.45; cursor: not-allowed; }

    /* ── Error message ─────────────────────────────────────── */
    .login-error {
      background: #FFF0F0;
      border: 1px solid #FFBDBD;
      color: #C0392B;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 0.84rem;
      font-weight: 500;
      margin-bottom: 20px;
    }

    .login-wordmark {
      margin-top: 28px;
      font-size: 0.72rem;
      color: #AFA9EC;
      letter-spacing: 0.3px;
    }

    @media (max-width: 420px) {
      .login-card { padding: 36px 24px 32px; }
      .pin-box { width: 42px; height: 52px; }
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="login-icon">🔒</div>
    <h1 class="login-title">Admin Access</h1>
    <p class="login-sub">Enter your 6-digit PIN to continue.</p>

    {% if error %}
    <div class="login-error">{{ error }}</div>
    {% endif %}

    <form id="pinForm" method="post" action="/admin/login">
      {# Hidden field that receives the assembled PIN #}
      <input type="hidden" name="pin" id="pinValue" />

      <div class="pin-row" id="pinRow">
        <input class="pin-box" type="tel" maxlength="1" inputmode="numeric" pattern="[0-9]" autocomplete="one-time-code" data-index="0" />
        <input class="pin-box" type="tel" maxlength="1" inputmode="numeric" pattern="[0-9]" data-index="1" />
        <input class="pin-box" type="tel" maxlength="1" inputmode="numeric" pattern="[0-9]" data-index="2" />
        <input class="pin-box" type="tel" maxlength="1" inputmode="numeric" pattern="[0-9]" data-index="3" />
        <input class="pin-box" type="tel" maxlength="1" inputmode="numeric" pattern="[0-9]" data-index="4" />
        <input class="pin-box" type="tel" maxlength="1" inputmode="numeric" pattern="[0-9]" data-index="5" />
      </div>

      <button type="submit" class="pin-submit" id="submitBtn" disabled>Unlock Dashboard</button>
    </form>

    <div class="login-wordmark">Posit+EV &mdash; Admin Portal</div>
  </div>

  <script>
    const boxes   = Array.from(document.querySelectorAll('.pin-box'));
    const pinInput = document.getElementById('pinValue');
    const submitBtn = document.getElementById('submitBtn');
    const form    = document.getElementById('pinForm');

    function getPin() {
      return boxes.map(b => b.value).join('');
    }

    function updateState() {
      const pin = getPin();
      pinInput.value = pin;
      submitBtn.disabled = pin.length < 6;
      boxes.forEach((b, i) => {
        b.classList.toggle('filled', b.value !== '');
      });
    }

    boxes.forEach((box, idx) => {
      box.addEventListener('keydown', (e) => {
        // Backspace: clear current, move back
        if (e.key === 'Backspace') {
          if (box.value === '' && idx > 0) {
            boxes[idx - 1].value = '';
            boxes[idx - 1].focus();
          } else {
            box.value = '';
          }
          updateState();
          e.preventDefault();
        }
        // Arrow keys
        if (e.key === 'ArrowLeft'  && idx > 0) boxes[idx - 1].focus();
        if (e.key === 'ArrowRight' && idx < 5) boxes[idx + 1].focus();
        // Enter: submit if complete
        if (e.key === 'Enter' && getPin().length === 6) form.submit();
      });

      box.addEventListener('input', () => {
        // Keep only the last digit typed (handles paste of single char)
        const val = box.value.replace(/[^0-9]/g, '');
        box.value = val.slice(-1);
        if (val && idx < 5) boxes[idx + 1].focus();
        updateState();
      });

      box.addEventListener('paste', (e) => {
        e.preventDefault();
        const pasted = (e.clipboardData || window.clipboardData)
          .getData('text').replace(/[^0-9]/g, '').slice(0, 6);
        pasted.split('').forEach((ch, i) => {
          if (boxes[i]) boxes[i].value = ch;
        });
        const next = Math.min(pasted.length, 5);
        boxes[next].focus();
        updateState();
      });

      // Prevent non-numeric input from mobile keyboards
      box.addEventListener('keypress', (e) => {
        if (!/[0-9]/.test(e.key)) e.preventDefault();
      });
    });

    // Auto-focus first box on load
    window.addEventListener('DOMContentLoaded', () => {
      boxes[0].focus();
      {% if error %}
      // Shake animation on error load
      boxes.forEach(b => { b.value = ''; b.classList.add('error'); });
      updateState();
      setTimeout(() => boxes.forEach(b => b.classList.remove('error')), 400);
      {% endif %}
    });
  </script>
</body>
</html>
